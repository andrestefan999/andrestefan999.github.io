<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andre's Tutoring Calendar</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.8/index.global.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Compact Container */
        #calendar-container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.06), 0 0 1px 1px rgba(0, 0, 0, 0.04);
            border: 1px solid #f1f5f9;
        }

        #calendar {
            height: auto;
        }

        /* Clean Borderless Layout */
        .fc {
            --fc-border-color: transparent;
            --fc-daygrid-day-bg-color: transparent;
        }

        .fc-theme-standard td, 
        .fc-theme-standard th {
            border: none !important;
        }

        .fc-theme-standard th {
            padding: 8px 0 14px 0 !important;
            font-weight: 600;
            color: #64748b;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* Header Navigation & Centered Title */
        .fc-header-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px !important;
        }

        .fc-toolbar-chunk:nth-child(2) {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .fc-toolbar-title {
            font-size: 1.25rem !important;
            font-weight: 700;
            color: #0f172a;
        }

        /* Elevating Navigation Buttons */
        .fc-button {
            background-color: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            color: #334155 !important;
            border-radius: 10px !important;
            padding: 6px 12px !important;
            font-size: 0.85rem !important;
            font-weight: 600 !important;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04) !important;
            transition: all 0.2s ease !important;
        }

        .fc-button:hover {
            background-color: #f8fafc !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08) !important;
            color: #0284c7 !important;
        }

        /* Centered Circle Day Format */
        .fc-daygrid-day-frame {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px !important;
            padding: 2px;
        }

        .fc-daygrid-day-top {
            justify-content: center;
            width: 100%;
        }

        .fc-daygrid-day-number {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.05rem;
            font-weight: 600;
            color: #1e293b;
            text-decoration: none !important;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Resting Light Blue for Today's Circle */
        .fc-day-today {
            background-color: transparent !important;
        }

        .fc-day-today .fc-daygrid-day-number {
            background-color: #e0f2fe;
            color: #0284c7;
            font-weight: 700;
        }

        /* Hover elevation effect for days (Fixes disappearing number bug) */
        .fc-daygrid-day:not(.fc-day-past) {
            cursor: pointer;
        }

        .fc-daygrid-day:not(.fc-day-past):hover .fc-daygrid-day-number {
            background-color: #0284c7 !important;
            color: #ffffff !important;
            transform: translateY(-2px) scale(1.08);
            box-shadow: 0 6px 14px rgba(2, 132, 199, 0.3);
        }

        /* Unselectable Past Days */
        .fc-day-past {
            opacity: 0.3;
            pointer-events: none !important;
            cursor: not-allowed !important;
        }

        /* Hide default FullCalendar event strips */
        .fc-daygrid-event-harness {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="calendar-container">
        <div id="calendar"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
